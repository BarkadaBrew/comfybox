name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Enable PrepareMetalShaders plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      # Keyed on Package.resolved so a dependency bump invalidates the cache;
      # restore-keys lets a partial hit still warm most of the build graph.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .build/xcode
          key: ${{ runner.os }}-derived-data-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-derived-data-

      - name: Type check
        run: |
          xcodebuild build -scheme ComfyBox -configuration Debug -destination 'platform=macOS' -derivedDataPath .build/xcode -skipPackagePluginValidation ENABLE_PLUGIN_PREPAREMLSHADERS=YES CLANG_COVERAGE_MAPPING=NO 2>&1

      # #332/#137: unit tier only (ZImageTests, ComfyBoxDesktopTests, ComfyBoxCatalogTests) runs
      # on every push/PR. ZImageIntegrationTests and ZImageE2ETests need model weights and a GPU
      # (intent.md: "Agents run unit tests only") and run nightly on a self-hosted runner instead —
      # see nightly-integration.yml.
      - name: Run unit tests
        run: |
          xcodebuild test -scheme comfybox-Package -destination 'platform=macOS' -enableCodeCoverage NO \
            -only-testing:ZImageTests \
            -only-testing:ComfyBoxDesktopTests \
            -only-testing:ComfyBoxCatalogTests \
            -derivedDataPath .build/xcode

  release-build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Enable PrepareMetalShaders plugin
        run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES

      - name: Release build
        run: |
          xcodebuild build -scheme ComfyBox -configuration Release -destination 'platform=macOS' -derivedDataPath ./dist -skipPackagePluginValidation ENABLE_PLUGIN_PREPAREMLSHADERS=YES CLANG_COVERAGE_MAPPING=NO

      - name: Prepare Artifacts
        run: |
          cd ./dist/Build/Products/Release
          chmod +x ComfyBox
          cp mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib .
          zip -r comfybox.macos.arm64.zip ComfyBox default.metallib

      - name: Get current date
        run: echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        env:
          CURRENT_DATE: ${{ env.CURRENT_DATE }}
        with:
          tag: nightly
          name: "Nightly Build ${{ env.CURRENT_DATE }}"
          draft: false
          prerelease: true
          allowUpdates: true
          artifacts: ./dist/Build/Products/Release/comfybox.macos.arm64.zip
          token: ${{ secrets.GITHUB_TOKEN }}
